<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="70 5 360 360" width="100%" height="100%" role="img" aria-labelledby="title">
  <title id="title">AlgoXAI Logo</title>
  <defs>
    <!-- Gradient for the fading inner plane of each blade -->
    <linearGradient id="fadeGrad" x1="242" y1="125" x2="155" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.0" />
    </linearGradient>

    <!-- Single Logo Blade (Top) -->
    <g id="blade">
      <!-- Fading inner parallelogram -->
      <polygon points="183,83 242,108 175,123 116,98" fill="url(#fadeGrad)" />
      <!-- Solid royal blue outer chevron + inner crescent hook -->
      <path d="M 183,58 L 288,88 L 242,155 C 244,132 215,122 195,144 C 204,122 224,116 242,122 L 242,108 L 183,83 Z" fill="#3B82F6" />
    </g>
  </defs>

  <!-- 5-Fold Symmetric Logo Mark Centered at (250, 185) -->
  <g>
    <use href="#blade" xlink:href="#blade" />
    <use href="#blade" xlink:href="#blade" transform="rotate(72, 250, 185)" />
    <use href="#blade" xlink:href="#blade" transform="rotate(144, 250, 185)" />
    <use href="#blade" xlink:href="#blade" transform="rotate(216, 250, 185)" />
    <use href="#blade" xlink:href="#blade" transform="rotate(288, 250, 185)" />
  </g>
</svg>
