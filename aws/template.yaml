AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AlgoX.ai - AI Chat Backend (Bedrock + WebSocket + DynamoDB)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        BEDROCK_REGION: us-east-1
        BEDROCK_MODEL_ID: us.amazon.nova-lite-v1:0
        BEDROCK_FALLBACK_MODEL_ID: us.amazon.nova-micro-v1:0
        DYNAMODB_TABLE_NAME: !Ref ChatHistoryTable
        DYNAMODB_WS_TABLE: !Ref WsConnectionsTable
        COGNITO_USER_POOL_ID: eu-north-1_Oqk1eSJFQ
        COGNITO_REGION: eu-north-1

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, dev]

Resources:

  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: algoxai-chat-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: algoxai

  WsConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: algoxai-ws-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: algoxai

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: algoxai-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: algoxai-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ChatHistoryTable.Arn
                  - !Sub '${ChatHistoryTable.Arn}/index/*'
                  - !GetAtt WsConnectionsTable.Arn
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: algoxai-ws-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref Stage
      AutoDeploy: true

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrchestratorFunction.Arn}/invocations'

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WsConnectIntegration}'

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WsConnectIntegration}'

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WsConnectIntegration}'

  WsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: algoxai-http-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, X-Session-Id]

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Stage
      AutoDeploy: true

  HistoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatHistoryFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  HistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /history/{proxy+}'
      Target: !Sub 'integrations/${HistoryIntegration}'

  HistoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatHistoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        Minify: false
        Sourcemap: false
        EntryPoints:
          - orchestrator/index.mjs
    Properties:
      FunctionName: algoxai-orchestrator
      Handler: index.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          WS_ENDPOINT: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
          CHAT_HISTORY_TABLE: !Ref ChatHistoryTable
          WS_CONNECTIONS_TABLE: !Ref WsConnectionsTable
          NODE_PATH: ./

  ConceptBreakerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        EntryPoints:
          - agent-concept-breaker/index.mjs
    Properties:
      FunctionName: algoxai-concept-breaker
      Handler: index.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90
      Environment:
        Variables:
          NODE_PATH: ./

  RefactorerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        EntryPoints:
          - agent-refactorer/index.mjs
    Properties:
      FunctionName: algoxai-refactorer
      Handler: index.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90
      Environment:
        Variables:
          NODE_PATH: ./

  TroubleShooterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        EntryPoints:
          - agent-trouble-shooter/index.mjs
    Properties:
      FunctionName: algoxai-trouble-shooter
      Handler: index.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90
      Environment:
        Variables:
          NODE_PATH: ./

  ChatHistoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2022
        EntryPoints:
          - chat-history/index.mjs
    Properties:
      FunctionName: algoxai-chat-history
      Handler: index.handler
      CodeUri: lambdas/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      Environment:
        Variables:
          CHAT_HISTORY_TABLE: !Ref ChatHistoryTable
          NODE_PATH: ./

Outputs:
  WsApiUrl:
    Description: WebSocket URL — set as VITE_AWS_API_WS_URL
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  HttpApiUrl:
    Description: HTTP API URL — set as VITE_AWS_API_HTTP_URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  ChatHistoryTableName:
    Value: !Ref ChatHistoryTable

  WsConnectionsTableName:
    Value: !Ref WsConnectionsTable
