AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AlgoX.ai - AI Chat Backend (Bedrock + WebSocket + DynamoDB)

# ─── Global defaults ────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Architectures: [arm64]      # Graviton2 — cheaper + faster for Node
    Environment:
      Variables:
        BEDROCK_REGION: us-east-1
        BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20241022-v2:0
        BEDROCK_FALLBACK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
        DYNAMODB_TABLE_NAME: !Ref ChatHistoryTable
        DYNAMODB_WS_TABLE: !Ref WsConnectionsTable
        COGNITO_USER_POOL_ID: eu-north-1_Oqk1eSJFQ
        COGNITO_REGION: eu-north-1

# ─── Parameters ─────────────────────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, dev]

# ─── Resources ──────────────────────────────────────────────────────────────
Resources:

  # ── DynamoDB: Chat history ─────────────────────────────────────────────
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: algoxai-chat-history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: algoxai

  # ── DynamoDB: Active WebSocket connections ─────────────────────────────
  WsConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: algoxai-ws-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: algoxai

  # ── Shared IAM Role for all Lambda functions ───────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: algoxai-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: algoxai-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock — invoke models with streaming
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              # DynamoDB — full access to our tables
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt ChatHistoryTable.Arn
                  - !Sub '${ChatHistoryTable.Arn}/index/*'
                  - !GetAtt WsConnectionsTable.Arn
              # API Gateway — push messages back via WebSocket connections
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  # ── WebSocket API Gateway ──────────────────────────────────────────────
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: algoxai-ws-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WsApi
      StageName: !Ref Stage
      AutoDeploy: true

  # Connect route
  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrchestratorFunction.Arn}/invocations'

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WsConnectIntegration}'

  # Disconnect route
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WsConnectIntegration}'

  # Default (chat) route
  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $default
      AuthorizationType: NONE
      Target: !Sub 'integrations/${WsConnectIntegration}'

  # Permission: API GW → invoke orchestrator Lambda
  WsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrchestratorFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*'

  # ── HTTP API Gateway (REST — history, health) ──────────────────────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: algoxai-http-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization, X-Session-Id]

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref Stage
      AutoDeploy: true

  # History Lambda integration
  HistoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatHistoryFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  HistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /history/{proxy+}'
      Target: !Sub 'integrations/${HistoryIntegration}'

  HistoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatHistoryFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ── Lambda: Orchestrator (WebSocket + Bedrock streaming) ───────────────
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        Minify: false
        Sourcemap: false
        EntryPoints:
          - index.mjs
        External:
          - '@aws-sdk/client-bedrock-runtime'
          - '@aws-sdk/client-apigatewaymanagementapi'
          - '@aws-sdk/client-dynamodb'
    Properties:
      FunctionName: algoxai-orchestrator
      Handler: index.handler
      CodeUri: lambdas/orchestrator/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 120          # longer for streaming responses
      MemorySize: 512
      Environment:
        Variables:
          WS_ENDPOINT: !Sub 'https://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
          CHAT_HISTORY_TABLE: !Ref ChatHistoryTable
          WS_CONNECTIONS_TABLE: !Ref WsConnectionsTable

  # ── Lambda: Concept Breaker agent ─────────────────────────────────────
  ConceptBreakerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        EntryPoints:
          - index.mjs
        External:
          - '@aws-sdk/client-bedrock-runtime'
          - '@aws-sdk/client-apigatewaymanagementapi'
    Properties:
      FunctionName: algoxai-concept-breaker
      Handler: index.handler
      CodeUri: lambdas/agent-concept-breaker/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90

  # ── Lambda: Refactorer agent ───────────────────────────────────────────
  RefactorerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        EntryPoints:
          - index.mjs
        External:
          - '@aws-sdk/client-bedrock-runtime'
          - '@aws-sdk/client-apigatewaymanagementapi'
    Properties:
      FunctionName: algoxai-refactorer
      Handler: index.handler
      CodeUri: lambdas/agent-refactorer/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90

  # ── Lambda: Trouble Shooter agent ─────────────────────────────────────
  TroubleShooterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        EntryPoints:
          - index.mjs
        External:
          - '@aws-sdk/client-bedrock-runtime'
          - '@aws-sdk/client-apigatewaymanagementapi'
    Properties:
      FunctionName: algoxai-trouble-shooter
      Handler: index.handler
      CodeUri: lambdas/agent-trouble-shooter/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90

  # ── Lambda: Chat History CRUD ──────────────────────────────────────────
  ChatHistoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Target: es2022
        EntryPoints:
          - index.mjs
        External:
          - '@aws-sdk/client-dynamodb'
          - '@aws-sdk/util-dynamodb'
    Properties:
      FunctionName: algoxai-chat-history
      Handler: index.handler
      CodeUri: lambdas/chat-history/
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      Environment:
        Variables:
          CHAT_HISTORY_TABLE: !Ref ChatHistoryTable

# ─── Outputs — these go into your .env after deploy ─────────────────────────
Outputs:
  WsApiUrl:
    Description: WebSocket URL — set as VITE_AWS_API_WS_URL
    Value: !Sub 'wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  HttpApiUrl:
    Description: HTTP API URL — set as VITE_AWS_API_HTTP_URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  ChatHistoryTableName:
    Value: !Ref ChatHistoryTable

  WsConnectionsTableName:
    Value: !Ref WsConnectionsTable
